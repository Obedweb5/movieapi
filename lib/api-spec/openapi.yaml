openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public catalog metadata operations
  - name: progress
    description: Authenticated watch progress operations
  - name: watchlist
    description: Authenticated watchlist operations
  - name: ratings
    description: Title ratings and reviews
  - name: admin
    description: Admin catalog and media management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /titles:
    get:
      operationId: listTitles
      tags: [catalog]
      summary: List public movie and series metadata
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Search titles and descriptions
        - in: query
          name: type
          schema:
            type: string
            enum: [movie, series]
        - in: query
          name: genre
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: integer
            minimum: 1870
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, rating, popular, title]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        "200":
          description: Paginated catalog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleListResponse"
  /titles/genres:
    get:
      operationId: listGenres
      tags: [catalog]
      summary: List distinct genres present in the catalog
      responses:
        "200":
          description: Distinct genre list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
  /titles/trending:
    get:
      operationId: listTrendingTitles
      tags: [catalog]
      summary: List titles ranked by recent view activity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Trending titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TitleSummary"
  /titles/{id}/similar:
    get:
      operationId: listSimilarTitles
      tags: [catalog]
      summary: List titles that share genres with the given title
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Similar titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TitleSummary"
        "404":
          description: Title not found
  /titles/{id}:
    get:
      operationId: getTitle
      tags: [catalog]
      summary: Get title metadata and episode listings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Title metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          description: Title not found
  /titles/{id}/playback:
    get:
      operationId: getPlaybackOptions
      tags: [catalog]
      summary: Get signed playback and download options for owned media
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Signed local media options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOptions"
        "404":
          description: Title or media assets not found
  /titles/{id}/progress:
    get:
      operationId: getTitleProgress
      tags: [progress]
      summary: Read the signed-in user's progress for a title
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Progress records for the title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleProgressResponse"
        "401":
          description: Authentication required
        "404":
          description: Title not found
    put:
      operationId: updateTitleProgress
      tags: [progress]
      summary: Save the signed-in user's progress for a title or episode
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleProgressInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "400":
          description: Invalid progress or episode does not belong to title
        "401":
          description: Authentication required
        "404":
          description: Title not found
  /episodes/{episodeId}/progress:
    get:
      operationId: getEpisodeProgress
      tags: [progress]
      summary: Read the signed-in user's progress for an episode
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Saved progress, or null when playback has not started
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProgressRecord"
                  - type: "null"
        "401":
          description: Authentication required
        "404":
          description: Episode not found
    put:
      operationId: updateEpisodeProgress
      tags: [progress]
      summary: Save the signed-in user's progress for an episode
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdateInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
        "400":
          description: Invalid progress
        "401":
          description: Authentication required
        "404":
          description: Episode not found
  /me/continue-watching:
    get:
      operationId: listContinueWatching
      tags: [progress]
      summary: List the signed-in user's most recently watched, unfinished titles
      security:
        - clerkSession: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Recently watched, incomplete progress records with title metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinueWatchingItem"
        "401":
          description: Authentication required
  /me/watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List the signed-in user's watchlist
      security:
        - clerkSession: []
      responses:
        "200":
          description: Watchlisted titles, most recently added first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TitleSummary"
        "401":
          description: Authentication required
  /titles/{id}/watchlist:
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a title to the signed-in user's watchlist
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "201":
          description: Added to watchlist (or already present)
        "401":
          description: Authentication required
        "404":
          description: Title not found
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a title from the signed-in user's watchlist
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removed from watchlist
        "401":
          description: Authentication required
  /titles/{id}/ratings:
    get:
      operationId: listTitleRatings
      tags: [ratings]
      summary: List ratings/reviews for a title, with the average score
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Rating summary and paginated reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRatingsResponse"
        "404":
          description: Title not found
  /titles/{id}/rating:
    put:
      operationId: upsertTitleRating
      tags: [ratings]
      summary: Create or update the signed-in user's rating/review for a title
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "200":
          description: Saved rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Invalid rating
        "401":
          description: Authentication required
        "404":
          description: Title not found
    delete:
      operationId: deleteTitleRating
      tags: [ratings]
      summary: Delete the signed-in user's rating for a title
      security:
        - clerkSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Rating deleted
        "401":
          description: Authentication required
  /episodes/{episodeId}/playback:
    get:
      operationId: getEpisodePlaybackOptions
      tags: [catalog]
      summary: Get signed playback and download options for an owned episode
      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Signed local media options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackOptions"
        "404":
          description: Episode or media assets not found
  /media/assets/{assetId}/{token}:
    get:
      operationId: serveMediaAsset
      tags: [catalog]
      summary: Serve a signed owned media asset
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media content
        "206":
          description: Partial media content
        "401":
          description: Invalid or expired signature
        "404":
          description: Media asset not found
  /admin/media-assets:
    post:
      operationId: registerMediaAsset
      tags: [catalog]
      summary: Register a local owned-media file
      parameters:
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
          description: Server-side MEDIA_ADMIN_KEY value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAssetInput"
      responses:
        "201":
          description: Registered media asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "400":
          description: Invalid asset
        "401":
          description: Invalid admin key
  /admin/media-ingestions:
    get:
      operationId: listMediaIngestions
      tags: [admin]
      summary: List media ingestion jobs
      parameters:
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [queued, processing, completed, failed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated media ingestion jobs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaIngestionJobListResponse"
        "401":
          description: Invalid admin key
    post:
      operationId: createMediaIngestion
      tags: [catalog]
      summary: Queue local video transcoding
      parameters:
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
          description: Server-side MEDIA_ADMIN_KEY value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaIngestionInput"
      responses:
        "202":
          description: Queued media ingestion job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaIngestionJob"
        "400":
          description: Invalid source, title, episode, or quality configuration
        "401":
          description: Invalid admin key
  /admin/media-ingestions/{jobId}:
    get:
      operationId: getMediaIngestion
      tags: [catalog]
      summary: Get video transcoding job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
          description: Server-side MEDIA_ADMIN_KEY value
      responses:
        "200":
          description: Media ingestion job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaIngestionJob"
        "401":
          description: Invalid admin key
        "404":
          description: Job not found
  /admin/titles:
    post:
      operationId: createTitle
      tags: [admin]
      summary: Manually create a catalog title
      parameters:
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleInput"
      responses:
        "201":
          description: Created title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleSummary"
        "400":
          description: Invalid title
        "401":
          description: Invalid admin key
        "409":
          description: A title with this sourceUrl already exists
  /admin/titles/{id}:
    put:
      operationId: updateTitle
      tags: [admin]
      summary: Update a catalog title
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleUpdateInput"
      responses:
        "200":
          description: Updated title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleSummary"
        "400":
          description: Invalid update
        "401":
          description: Invalid admin key
        "404":
          description: Title not found
    delete:
      operationId: deleteTitle
      tags: [admin]
      summary: Delete a catalog title and its episodes, media, and progress
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Title deleted
        "401":
          description: Invalid admin key
        "404":
          description: Title not found
  /admin/titles/{id}/episodes:
    post:
      operationId: createEpisode
      tags: [admin]
      summary: Manually create an episode under a title
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeInput"
      responses:
        "201":
          description: Created episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: Invalid episode
        "401":
          description: Invalid admin key
        "404":
          description: Title not found
        "409":
          description: An episode with this season/episode number already exists
  /admin/episodes/{episodeId}:
    put:
      operationId: updateEpisode
      tags: [admin]
      summary: Update an episode
      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeUpdateInput"
      responses:
        "200":
          description: Updated episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: Invalid update
        "401":
          description: Invalid admin key
        "404":
          description: Episode not found
    delete:
      operationId: deleteEpisode
      tags: [admin]
      summary: Delete an episode and its media/progress
      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Episode deleted
        "401":
          description: Invalid admin key
        "404":
          description: Episode not found
  /admin/media-assets/{assetId}:
    delete:
      operationId: deleteMediaAsset
      tags: [admin]
      summary: Delete a registered media asset record (does not delete the file on disk)
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Media asset deleted
        "401":
          description: Invalid admin key
        "404":
          description: Media asset not found
  /admin/media-ingestions/{jobId}/retry:
    post:
      operationId: retryMediaIngestion
      tags: [admin]
      summary: Re-queue a failed media ingestion job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: header
          name: x-media-admin-key
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Re-queued job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaIngestionJob"
        "401":
          description: Invalid admin key
        "404":
          description: Job not found
        "409":
          description: Job is not in a failed state
  /catalog/import:
    post:
      operationId: importCatalogMetadata
      tags: [catalog]
      summary: Import public catalog metadata from an approved host
      description: >
        Fetches publicly accessible HTML and JSON-LD metadata only. It does not
        inspect, store, proxy, or return playback URLs, download URLs, manifests,
        session tokens, cookies, authorization headers, or other protected data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResponse"
        "400":
          description: Invalid request or host not approved
        "502":
          description: Source could not be fetched
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: Clerk session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TitleSummary:
      type: object
      required: [id, title, type, genres, sourceUrl, lastSyncedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [movie, series]
        posterUrl:
          type: ["string", "null"]
          format: uri
        synopsis:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        genres:
          type: array
          items:
            type: string
        rating:
          type: ["number", "null"]
        sourceUrl:
          type: string
          format: uri
        lastSyncedAt:
          type: string
          format: date-time
    Episode:
      type: object
      required: [id, titleId, seasonNumber, episodeNumber, title, sourceUrl]
      properties:
        id:
          type: integer
        titleId:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        title:
          type: string
        synopsis:
          type: ["string", "null"]
        airDate:
          type: ["string", "null"]
          format: date
        sourceUrl:
          type: string
          format: uri
    TitleDetail:
      allOf:
        - $ref: "#/components/schemas/TitleSummary"
        - type: object
          required: [episodes]
          properties:
            episodes:
              type: array
              items:
                $ref: "#/components/schemas/Episode"
    TitleListResponse:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ProgressUpdateInput:
      type: object
      required: [positionSeconds, completed]
      properties:
        positionSeconds:
          type: integer
          minimum: 0
        durationSeconds:
          type: ["integer", "null"]
          minimum: 0
        completed:
          type: boolean
    TitleProgressInput:
      allOf:
        - $ref: "#/components/schemas/ProgressUpdateInput"
        - type: object
          properties:
            episodeId:
              type: ["integer", "null"]
              minimum: 1
    ProgressRecord:
      type: object
      required:
        [titleId, episodeId, positionSeconds, durationSeconds, completed, updatedAt]
      properties:
        titleId:
          type: integer
        episodeId:
          type: ["integer", "null"]
        positionSeconds:
          type: integer
          minimum: 0
        durationSeconds:
          type: ["integer", "null"]
          minimum: 0
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    TitleProgressResponse:
      type: object
      required: [titleId, items]
      properties:
        titleId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgressRecord"
    CatalogImportInput:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          format: uri
        maxPages:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
    CatalogImportResponse:
      type: object
      required: [sourceUrl, imported, skipped]
      properties:
        sourceUrl:
          type: string
          format: uri
        imported:
          type: integer
        skipped:
          type: integer
    MediaAsset:
      type: object
      required: [id, titleId, kind, label, mimeType, isDownloadable]
      properties:
        id:
          type: integer
        titleId:
          type: integer
        episodeId:
          type: ["integer", "null"]
        kind:
          type: string
          enum: [manifest, video, download, subtitle]
        label:
          type: string
        mimeType:
          type: string
        language:
          type: ["string", "null"]
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        width:
